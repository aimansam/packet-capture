[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "packet-analyzer"
version = "1.0.0"
description = "Simulation-based network packet analysis CLI"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = []

[project.scripts]
packet-analyzer = "scanner:main"

[tool.setuptools]
py-modules = ["scanner"]
